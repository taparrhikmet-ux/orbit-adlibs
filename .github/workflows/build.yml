name: Build Orbit Adlibs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Configure build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build VST3
        run: |
          cmake --build build --config Release --target OrbitAdlibs_VST3 --parallel 3

      - name: Collect VST3
        run: |
          mkdir -p output
          cp -R "build/OrbitAdlibs_artefacts/Release/VST3/Orbit Adlibs.vst3" output/

      - name: Upload ready VST3
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Adlibs-VST3
          path: output/
